on:
    push:
      branches: [main]
    release:
        types: [published]
    workflow_dispatch: {}

name: demo-website

jobs:
    demo-page:
        runs-on: ubuntu-latest
        # Only restrict concurrency for non-PR jobs
        concurrency:
          group: quarto-publish-${{ github.event_name != 'pull_request' || github.run_id }}
        permissions:
          contents: write
        steps:
        - name: "Check out repository"
          uses: actions/checkout@v4

        # To render using knitr, we need a few more setup steps...
        # If we didn't want the examples to use `engine: knitr`, we could
        # skip a few of the setup steps.
        - name: "Setup R"
          uses: r-lib/actions/setup-r@v2

        - name: "Setup R dependencies for Quarto's knitr engine"
          uses: r-lib/actions/setup-r-dependencies@v2
          with:
            packages:
              any::knitr
              any::rmarkdown
              any::downlit
              any::xml2
              any::ggplot2

        - name: "Install ms-corefonts"
          run: |
            echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
            sudo apt install ttf-mscorefonts-installer

      # update font cache
        - name: "Update font cache"
          run: sudo fc-cache -fv

      # Back to our regularly scheduled Quarto output
        - name: "Set up Quarto"
          uses: quarto-dev/quarto-actions/setup@v2
          with:
            version: "release"

        - name: Add extension directly into demos
          working-directory: ./docs
          run: |
            quarto add CCDM-CBADA/CBADAQuarto --no-prompt

        - name: Copy fonts from extension to docs
          run: |
            mkdir -p ./docs/fonts
            cp -r ./docs/_extensions/CCDM-CBADA/cbada/CBADAQuarto/revealjs/fonts/* ./docs/fonts/

        - name: Publish to GitHub Pages (and render)
          uses: quarto-dev/quarto-actions/publish@v2
          with:
              target: gh-pages
              path: docs
