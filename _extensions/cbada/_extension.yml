
title: CBADAQuarto
author: Adam H. Sparks, James J. Balamuta, Russell Edson, Vinh Thiem Ma, Rose Megirian, Zhanglong Cao, Sam Rogers, Julian Taylor
version: 0.0.1
quarto-required: ">=1.4.0"

contributes:
  formats:
    revealjs:
      theme:
        - default
        - revealjs/cbadaquarto.scss

      embed-resources: true

      format-resources:
        - assets/ccdm-logos.png
        - assets/title-slide-main.png
        - assets/fonts/FiraCode-Regular.woff2
        - assets/fonts/FiraCode-Medium.woff2
        - assets/fonts/FiraCode-Bold.woff2

      date-format: long
      slide-number: false
      footer: ""
      logo: assets/ccdm-logos.png

      title-slide-attributes:
        data-background-image: assets/title-slide-main.png
        data-background-size: cover
        data-background-position: center

      highlight-style: breeze
      overview: true
      progress: true
      touch: true
      chalkboard: false
      menu: false

      echo: true
